[package]
name = "homework"
version = "0.1.0"
description = "A simple homework management tool for the classroom"
authors = ["Julien Ponge"]
license = "LGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
# `thin`, not fat LTO: fat is marginally smaller/faster but noticeably slower to
# compile, and the Windows cross-build and Linux Podman build are already the
# slow part of releasing.
lto = "thin"
codegen-units = 1
# Drops the symbol table only — panic messages still print, just without
# symbolized backtraces, which nobody relies on since this app ships no
# debugger to end users.
strip = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "homework_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

